<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Meadow Voxels</title></head><body><main id="app"><canvas id="game"></canvas><button id="gear" title="설정" aria-label="설정">⚙</button><section id="cover"><h1>MEADOW<br/>VOXELS</h1><p>작고 가벼운 나만의 블록 세계</p><button id="play">세계에 들어가기</button><small>WASD 이동 · 마우스 시점 · Space 점프<br/>왼쪽 클릭 파괴 · 오른쪽 클릭 설치 · 1–9 블록 선택</small></section><div id="hud" hidden><div id="crosshair">+</div><div id="status"><span id="coords"></span><span id="clock"></span></div><div id="hint">ESC로 설정 열기 · R 새 세계</div><div id="hotbar"></div></div><section id="settings" hidden><h2>설정</h2><label>렌더 거리 (청크 반경): <span id="renderDistanceValue"></span><input type="range" id="renderDistance" min="8" max="24" step="1"/></label><label>마우스 감도: <span id="sensitivityValue"></span><input type="range" id="sensitivity" min="0.3" max="3" step="0.1"/></label><button id="closeSettings">닫기</button></section></main><script type="module" src="/src/main.ts"></script></body></html>
